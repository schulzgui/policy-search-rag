[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-search-rag"
version = "1.0.0"
description = "Policy Search RAG — avaliação reproduzível com dados sintéticos"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
policy-search-rag = "policy_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
